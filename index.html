<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>rorraxy - Code Preview</title>
  <style>
    :root {
      --bg-dark: #08080a;
      --panel-bg: rgba(18, 18, 23, 0.96);
      --card-bg: #16161e;
      --border-color: #262635;
      --accent-gold: #d4af37;
      --accent-gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
      --text-main: #ffffff;
      --text-muted: #8a8a9e;
      --danger-color: #e63946;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #000;
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* 100% Fullscreen Preview Area */
    .preview-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
      overflow: hidden;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100%;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: #ffffff;
    }

    .iframe-wrapper.mobile-view {
      width: 375px;
      height: 667px;
      border-radius: 20px;
      border: 8px solid #222;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* Floating Toggle Button with Golden Gear Icon & White Text */
    .floating-toggle-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 999;
      background: #0d0d12;
      color: #ffffff;
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
    }

    .floating-toggle-btn:hover {
      border-color: var(--accent-gold);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.25);
    }

    /* Golden SVG Gear Icon */
    .gear-icon {
      width: 18px;
      height: 18px;
      fill: url(#gold-grad);
    }

    /* Overlay Backdrop */
    .popup-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .popup-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Floating Code Panel Folder with Fixed Scrolling Support */
    .popup-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      width: 480px;
      max-width: 94vw;
      max-height: 88vh;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px;
      z-index: 1001;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow-y: auto;
    }

    .popup-backdrop.active .popup-panel {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .close-btn:hover { color: #fff; }

    .section-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Dynamic HTML Box (Hidden by default) */
    #htmlSectionBox {
      display: none;
    }

    .section-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .file-input-wrapper input[type="file"] { display: none; }

    .file-label {
      display: block;
      background: #0d0d12;
      border: 1px dashed var(--border-color);
      padding: 8px;
      text-align: center;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .file-label:hover { border-color: var(--accent-gold); color: var(--text-main); }

    textarea {
      width: 100%;
      height: 90px;
      background: #08080b;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #7ef2a9;
      font-family: 'Consolas', monospace;
      font-size: 0.82rem;
      padding: 10px;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: var(--accent-gold); }
    #htmlCode { color: #ff9e64; height: 220px; }
    #jsonCode { color: #f1fa8c; }
    #jsCode { color: #64dfdf; }

    /* Action Buttons Row */
    .action-btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
      flex-shrink: 0;
    }

    .btn-generate {
      flex: 1;
      background: var(--accent-gold-gradient);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
      transition: all 0.2s ease;
    }

    .btn-generate:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-html-toggle {
      flex: 1;
      background: #191924;
      color: #ffffff;
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .btn-html-toggle:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      background: #222230;
    }

    .sub-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .view-switcher {
      display: flex;
      background: #0d0d12;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2px;
      flex: 1;
    }

    .view-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .view-btn.active {
      background: #1f1f2c;
      color: var(--accent-gold);
    }

    .btn-clear {
      background: rgba(230, 57, 70, 0.12);
      border: 1px solid rgba(230, 57, 70, 0.35);
      color: #ff6b6b;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-clear:hover {
      background: var(--danger-color);
      color: #fff;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 2px; }

    /* Mobile Adaptations */
    @media (max-width: 600px) {
      .popup-panel { padding: 12px; gap: 8px; max-height: 90vh; }
      textarea { height: 75px; }
      #htmlCode { height: 180px; }
      .floating-toggle-btn { top: 10px; left: 10px; padding: 8px 14px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <!-- Hidden SVG for Gold Gradient definition -->
  <svg width="0" height="0" style="position:absolute;">
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf953f" />
      <stop offset="33%" stop-color="#fcf6ba" />
      <stop offset="66%" stop-color="#b38728" />
      <stop offset="100%" stop-color="#fbf5b7" />
    </linearGradient>
  </svg>

  <!-- Black Floating Toggle Button with Golden Gear -->
  <button class="floating-toggle-btn" onclick="togglePopup(true)">
    <svg class="gear-icon" viewBox="0 0 24 24">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c-.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/>
    </svg>
    <span style="color:#ffffff;">Code Editor</span>
  </button>

  <!-- Full Screen Canvas Preview Area -->
  <div class="preview-container">
    <div class="iframe-wrapper" id="iframeWrapper">
      <iframe id="previewFrame"></iframe>
    </div>
  </div>

  <!-- Pop-up Overlay Backdrop -->
  <div class="popup-backdrop" id="popupBackdrop">
    
    <!-- Pop-up Control Panel Folder -->
    <div class="popup-panel">
      
      <div class="panel-header">
        <div class="panel-title" id="panelTitle">Code Editor Panel</div>
        <button class="close-btn" onclick="togglePopup(false)">✕</button>
      </div>

      <!-- Main Container: CSS, JSON & JS Boxes -->
      <div id="cssJsContainer">
        <!-- 1. CSS Box -->
        <div class="section-box" style="margin-bottom: 8px;">
          <div class="section-title">1. CSS STYLESHEET</div>
          <div class="file-input-wrapper">
            <label class="file-label" for="cssFileInput" id="cssFileLabel">Upload CSS File</label>
            <input type="file" id="cssFileInput" accept="*" onchange="handleFileUpload(event, 'cssCode', 'cssFileLabel')">
          </div>
          <textarea id="cssCode" placeholder="Paste CSS code here..."></textarea>
        </div>

        <!-- 2. JSON Box -->
        <div class="section-box" style="margin-bottom: 8px;">
          <div class="section-title">2. JSON DATA</div>
          <div class="file-input-wrapper">
            <label class="file-label" for="jsonFileInput" id="jsonFileLabel">Upload JSON File</label>
            <input type="file" id="jsonFileInput" accept="*" onchange="handleFileUpload(event, 'jsonCode', 'jsonFileLabel')">
          </div>
          <textarea id="jsonCode" placeholder="Paste JSON data here..."></textarea>
        </div>

        <!-- 3. JS Box -->
        <div class="section-box">
          <div class="section-title">3. JAVASCRIPT CODE</div>
          <div class="file-input-wrapper">
            <label class="file-label" for="jsFileInput" id="jsFileLabel">Upload JS File</label>
            <input type="file" id="jsFileInput" accept="*" onchange="handleFileUpload(event, 'jsCode', 'jsFileLabel')">
          </div>
          <textarea id="jsCode" placeholder="Paste JS code here..."></textarea>
        </div>
      </div>

      <!-- Mode 2: Single HTML Box (Shows ONLY when HTML Mode is clicked) -->
      <div class="section-box" id="htmlSectionBox">
        <div class="section-title">HTML MARKUP</div>
        <div class="file-input-wrapper">
          <label class="file-label" for="htmlFileInput" id="htmlFileLabel">Upload HTML File</label>
          <input type="file" id="htmlFileInput" accept="*" onchange="handleFileUpload(event, 'htmlCode', 'htmlFileLabel')">
        </div>
        <textarea id="htmlCode" placeholder="Paste complete HTML code here..."></textarea>
      </div>

      <!-- Split Action Buttons -->
      <div class="action-btn-row">
        <button class="btn-generate" onclick="generatePage()">GENERATE</button>
        <button class="btn-html-toggle" id="htmlToggleBtn" onclick="switchMode()">HTML CODE</button>
      </div>

      <!-- View Controls & Clear All -->
      <div class="sub-controls">
        <div class="view-switcher">
          <button class="view-btn active" id="desktopViewBtn" onclick="switchView('desktop')">💻 Desktop</button>
          <button class="view-btn" id="mobileViewBtn" onclick="switchView('mobile')">📱 Mobile</button>
        </div>
        <button class="btn-clear" onclick="clearAll()">Clear All</button>
      </div>

    </div>

  </div>

  <script>
    let currentMode = 'cssjs'; // 'cssjs' or 'html'

    // Pop-up Toggle Logic
    function togglePopup(show) {
      const backdrop = document.getElementById('popupBackdrop');
      if (show) {
        backdrop.classList.add('active');
      } else {
        backdrop.classList.remove('active');
      }
    }

    // Switch between (CSS + JSON + JS Mode) and (Single HTML Mode)
    function switchMode() {
      const cssJsBox = document.getElementById('cssJsContainer');
      const htmlBox = document.getElementById('htmlSectionBox');
      const toggleBtn = document.getElementById('htmlToggleBtn');
      const title = document.getElementById('panelTitle');

      if (currentMode === 'cssjs') {
        // Hide CSS + JSON + JS, Show ONLY HTML
        cssJsBox.style.display = 'none';
        htmlBox.style.display = 'flex';
        toggleBtn.innerText = 'CSS, JSON & JS CODE';
        title.innerText = 'HTML Editor Panel';
        currentMode = 'html';
      } else {
        // Show CSS + JSON + JS, Hide HTML
        cssJsBox.style.display = 'block';
        htmlBox.style.display = 'none';
        toggleBtn.innerText = 'HTML CODE';
        title.innerText = 'Code Editor Panel';
        currentMode = 'cssjs';
      }
    }

    // Close popup when clicking backdrop outside panel
    document.getElementById('popupBackdrop').addEventListener('click', function(e) {
      if (e.target === this) {
        togglePopup(false);
      }
    });

    // Generate Page and Render Frame
    function generatePage() {
      const html = document.getElementById('htmlCode').value;
      const css = document.getElementById('cssCode').value;
      const json = document.getElementById('jsonCode').value;
      const js = document.getElementById('jsCode').value;

      const iframe = document.getElementById('previewFrame');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

      let fullSource = '';

      if (currentMode === 'html' && html.trim()) {
        // Render Pure HTML input
        fullSource = html;
      } else {
        // Render CSS + JSON + JS mode
        const bodyContent = html.trim() ? html : `
          <div id="statusAlert" style="display:none;"></div>
          <div id="app"></div>
          <div id="root"></div>
        `;

        // JSON Safe Script Injection
        const jsonScript = json.trim() ? `
          try {
            window.jsonData = ${json};
          } catch(e) {
            console.error("Invalid JSON format:", e);
            window.jsonData = null;
          }
        ` : 'window.jsonData = null;';

        fullSource = `
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <style>
              ${css}
            </style>
          </head>
          <body>
            ${bodyContent}

            <script>
              ${jsonScript}
              try {
                ${js}
              } catch (err) {
                console.error(err);
              }
            <\/script>
          </body>
          </html>
        `;
      }

      iframeDoc.open();
      iframeDoc.write(fullSource);
      iframeDoc.close();

      // Automatically hide popup after generating
      togglePopup(false);
    }

    // Device View Switcher
    function switchView(mode) {
      const wrapper = document.getElementById('iframeWrapper');
      const desktopBtn = document.getElementById('desktopViewBtn');
      const mobileBtn = document.getElementById('mobileViewBtn');

      if (mode === 'mobile') {
        wrapper.classList.add('mobile-view');
        mobileBtn.classList.add('active');
        desktopBtn.classList.remove('active');
      } else {
        wrapper.classList.remove('mobile-view');
        desktopBtn.classList.add('active');
        mobileBtn.classList.remove('active');
      }
    }

    // File Upload Reader
    function handleFileUpload(event, targetTextareaId, labelId) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById(labelId).innerText = "File: " + file.name;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById(targetTextareaId).value = e.target.result;
      };
      reader.readAsText(file);
    }

    // Clear All Functionality
    function clearAll() {
      document.getElementById('htmlCode').value = '';
      document.getElementById('cssCode').value = '';
      document.getElementById('jsonCode').value = '';
      document.getElementById('jsCode').value = '';

      document.getElementById('htmlFileLabel').innerText = "Upload HTML File";
      document.getElementById('cssFileLabel').innerText = "Upload CSS File";
      document.getElementById('jsonFileLabel').innerText = "Upload JSON File";
      document.getElementById('jsFileLabel').innerText = "Upload JS File";

      document.getElementById('htmlFileInput').value = '';
      document.getElementById('cssFileInput').value = '';
      document.getElementById('jsonFileInput').value = '';
      document.getElementById('jsFileInput').value = '';
      
      const iframe = document.getElementById('previewFrame');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      iframeDoc.open();
      iframeDoc.write('');
      iframeDoc.close();
    }
  </script>
</body>
</html>
